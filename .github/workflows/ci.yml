  scan:
    name: Security scan prod image
    if: needs.config.outputs.scan-prod-image == '1'
    needs: [build-prod, config]
    permissions:
      id-token: write
      contents: read
      packages: read
      checks: write
      pull-requests: write
      issues: read
      # Upload SARIF report files
      security-events: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.config.outputs.prod-matrix) }}
    env:
      DOCKER_FILE: deploy/${{ matrix.os }}.Dockerfile
      VAR: ${{ matrix.elixir }}-erlang-${{ matrix.otp }}-${{ matrix.os }}-${{ matrix.build_os_ver }}
      GITHUB_ADVANCED_SECURITY: ${{ needs.config.outputs.github-advanced-security }}
      TRIVY: ${{ needs.config.outputs.scan-trivy }}
      GRYPE: ${{ needs.config.outputs.scan-grype }}
      SNYK: ${{ needs.config.outputs.scan-snyk }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:${VAR}${IMAGE_VER}"

      - name: Scan image with Trivy
        if: env.TRIVY == '1'
        uses: aquasecurity/trivy-action@0.69.3
        # https://github.com/aquasecurity/trivy-action
        # https://github.com/marketplace/actions/aqua-security-trivy#inputs
        with:
          image-ref: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.VAR }}${{ env.IMAGE_VER }}
          # exit-code: '1' # fail build
          # ignore-unfixed: true
          # vuln-type: 'os,library'
          # severity: 'CRITICAL,HIGH'
          # cache-dir: /var/cache
          format: ${{ env.GITHUB_ADVANCED_SECURITY == '1' && 'sarif' || 'table' }}
          # output: ${{ env.GITHUB_ADVANCED_SECURITY == '1' && 'trivy-results.sarif' }}

      - name: Display scan results
        if: ${{ env.TRIVY == '1' && always() && env.GITHUB_ADVANCED_SECURITY == '1' }}
        run: cat trivy-results.sarif | jq .

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ env.TRIVY == '1' && always() && env.GITHUB_ADVANCED_SECURITY == '1' }}
        uses: github/codeql-action/upload-sarif@v3
        # Requires GitHub Advanced Security
        # https://docs.github.com/en/get-started/learning-about-github/about-github-advanced-security
        # https://docs.github.com/en/code-security/code-scanning/integrating-with-code-scanning/sarif-support-for-code-scanning
        # https://docs.github.com/en/code-security/code-scanning/integrating-with-code-scanning/uploading-a-sarif-file-to-github
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

      - name: Scan image with Grype
        if: env.GRYPE == '1'
        uses: anchore/scan-action@v7
        # https://github.com/marketplace/actions/anchore-container-scan
        id: scan-grype
        with:
          image: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.VAR }}${{ env.IMAGE_VER }}
          # severity-cutoff: critical
          fail-build: false
          # output-format: 'sarif'
          output-format: table
          # output-format: ${{ env.GITHUB_ADVANCED_SECURITY == '1' && 'sarif' || 'table' }}

      - name: Display scan results
        if: ${{ env.GRYPE == '1' && always() && env.GITHUB_ADVANCED_SECURITY == '1' }}
        run: cat ${{ steps.scan-grype.outputs.sarif }} | jq .

      - name: Upload Grype scan results to GitHub Security tab
        if: ${{ env.GRYPE == '1' && always() && env.GITHUB_ADVANCED_SECURITY == '1' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan-grype.outputs.sarif }}
          category: grype

      - name: Scan image with Snyk
        if: env.SNYK == '1'
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          image: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.VAR }}${{ env.IMAGE_VER }}
          args: --file=${{ env.DOCKER_FILE }} --project-name=api


  deploy-ecs:
    name: Deploy to AWS ECS
    if: needs.config.outputs.deploy-ecs == '1'
    # needs: [test, test-prod, test-dialyzer, upload-assets, config]
    needs: [test, test-prod, config]
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.config.outputs.deploy-matrix) }}
    env:
      AWS_ENABLED: ${{ needs.config.outputs.aws-enabled }}
      DOCKER_FILE: deploy/${{ matrix.os }}.Dockerfile
      ECS_CLUSTER: foo
      # ECR_REGISTRY_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      VAR: ${{ matrix.elixir }}-erlang-${{ matrix.otp }}-${{ matrix.os }}-${{ matrix.build_os_ver }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set vars for runtime info
        shell: bash
        run: |
          echo "GIT_SHA_SHORT=$(echo $GITHUB_SHA | cut -c 1-7)" >> "$GITHUB_ENV"
          echo "GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "GIT_AUTHOR=$(git log -1 --pretty=format:'%ae')" >> "$GITHUB_ENV"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set vars
        run: echo "ECR_REGISTRY=${{ steps.ecr-login.outputs.registry }}" >> "$GITHUB_ENV"
        # echo "ECR_REGISTRY=${{ env.ECR_REGISTRY_ID }}.dkr.ecr.${{ env.ECR_REGISTRY_REGION }}.amazonaws.com" >> "$GITHUB_ENV"

      - name: Generate ECS task-defintion.json
        env:
          APP_CPU: 256
          APP_RAM: 512
          ARCH: "X86_64"
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_PS_PREFIX: ${{ vars.AWS_PS_PREFIX }}
          AWSLOGS_GROUP: /ecs/foo-app
          AWSLOGS_REGION: ${{ vars.AWS_REGION }}
          AWSLOGS_STREAM_PREFIX: foo-app
          BUILD_NUM: ${{ github.run_number }}
          COMP: "app"
          CONTAINER_NAME: foo-app
          ENV: ${{ needs.config.outputs.environment }}
          EXECUTION_ROLE_ARN: ${{ secrets.EXECUTION_ROLE_ARN}}
          FAMILY: "foo-app"
          GIT_HEAD_REF: ${{ github.head_ref }}
          HTTP_PORT: 4000
          HTTPS_PORT: 4001
          IMAGE_OTEL: "${{ env.ECR_REGISTRY }}/${{ env.ECR_IMAGE_OWNER }}aws-otel-collector:latest"
          IMAGE: "${{ env.ECR_REGISTRY }}/${{ env.ECR_IMAGE_OWNER }}${{ env.IMAGE_NAME }}:${{ env.IMAGE_VER }}"
          ROLES: "app,web"
          SERVICE: foo-app
          TASK_ROLE_ARN: ${{ secrets.TASK_ROLE_ARN }}
        run: jq --null-input -f "ecs/task-definition.${COMP}.json.jq" | tee "/tmp/task-definition.${COMP}.json"

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: /tmp/task-definition.app.json
          cluster: foo
          service: foo-app
          # wait-for-service-stability: true

      - name: Generate ECS task-defintion.json (api)
        env:
          APP_CPU: 256
          APP_RAM: 512
          ARCH: "X86_64"
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_PS_PREFIX: ${{ vars.AWS_PS_PREFIX }}
          AWSLOGS_GROUP: /ecs/foo-api
          AWSLOGS_REGION: ${{ vars.AWS_REGION }}
          AWSLOGS_STREAM_PREFIX: foo-api
          BUILD_NUM: ${{ github.run_number }}
          COMP: "api"
          CONTAINER_NAME: foo-app
          ENV: ${{ needs.config.outputs.environment }}
          EXECUTION_ROLE_ARN: ${{ secrets.EXECUTION_ROLE_ARN}}
          FAMILY: "foo-api"
          GIT_HEAD_REF: ${{ github.head_ref }}
          HTTP_PORT: 4000
          HTTPS_PORT: 4001
          IMAGE_OTEL: "${{ env.ECR_REGISTRY }}/${{ env.ECR_IMAGE_OWNER }}aws-otel-collector:latest"
          IMAGE: "${{ env.ECR_REGISTRY }}/${{ env.ECR_IMAGE_OWNER }}${{ env.IMAGE_NAME }}:${{ env.IMAGE_VER }}"
          ROLES: "api"
          SERVICE: foo-api
          TASK_ROLE_ARN: ${{ secrets.TASK_ROLE_ARN }}
        run: jq --null-input -f "ecs/task-definition.${COMP}.json.jq" | tee "/tmp/task-definition.${COMP}.json"

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: /tmp/task-definition.app.json
          cluster: foo
          service: foo-app
          # wait-for-service-stability: true

      - name: Generate ECS task-defintion.json (worker)
        env:
          APP_CPU: 256
          APP_RAM: 512
          ARCH: "X86_64"
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_PS_PREFIX: ${{ vars.AWS_PS_PREFIX }}
          AWSLOGS_GROUP: /ecs/foo-worker
          AWSLOGS_REGION: ${{ vars.AWS_REGION }}
          AWSLOGS_STREAM_PREFIX: foo-worker
          BUILD_NUM: ${{ github.run_number }}
          COMP: "worker"
          CONTAINER_NAME: foo-app
          ECS_SERVICE: foo-worker
          ENV: ${{ needs.config.outputs.environment }}
          EXECUTION_ROLE_ARN: ${{ secrets.EXECUTION_ROLE_ARN}}
          FAMILY: "foo-worker"
          GIT_HEAD_REF: ${{ github.head_ref }}
          HTTP_PORT: 4000
          HTTPS_PORT: 4001
          IMAGE_OTEL: "${{ env.ECR_REGISTRY }}/${{ env.ECR_IMAGE_OWNER }}aws-otel-collector:latest"
          IMAGE: "${{ env.ECR_REGISTRY }}/${{ env.ECR_IMAGE_OWNER }}${{ env.IMAGE_NAME }}:${{ env.IMAGE_VER }}"
          ROLES: "worker"
          SERVICE: foo-worker
          TASK_ROLE_ARN: ${{ secrets.TASK_ROLE_ARN }}
        run: jq --null-input -f "ecs/task-definition.${COMP}.json.jq" | tee "/tmp/task-definition.${COMP}.json"

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: /tmp/task-definition.worker.json
          cluster: foo
          service: foo-worker
          # wait-for-service-stability: true

      # - name: Run CodeBuild
      #   uses: aws-actions/aws-codebuild-run-build@v1
      #   with:
      #     project-name: "foo-app"
      #     # buildspec-override: ecs/buildspec-docker.yml
      #     env-vars-for-codebuild: |
      #       custom,
      #       requester,
      #       event-name
      #   env:
      #     custom: my environment variable
      #     requester: ${{ github.actor }}
      #     event-name: ${{ github.event_name }}

      - name: Create Sentry release
        uses: getsentry/action-release@v3
        if: needs.config.outputs.notify-sentry == '1'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          # SENTRY_URL: https://sentry.io/
        with:
          environment: ${{ (github.ref_name == 'main' && 'staging') || (github.ref_name == 'prod' && 'production') }}
          dist: ${{ github.run_number }}
          # ignore_missing: true

      - name: Create AppSignal revision
        if: needs.config.outputs.notify-appsignal == '1'
        env:
          APPSIGNAL_APP_ENV: ${{ (github.ref_name == 'main' && 'stage') || (github.ref_name == 'qa' && 'qa') || (github.ref_name == 'prod' && 'prod') }}
          # APPSIGNAL_APP_ENV: ${{ (github.ref == 'refs/tags/prod' && 'prod') || (github.ref_name == 'main' && 'stage') || 'stage' }}
          APPSIGNAL_APP_NAME: ${{ env.ECS_SERVICE }}
          APPSIGNAL_PUSH_API_KEY: ${{ secrets.APPSIGNAL_PUSH_API_KEY }}
          REVISION: ${{ env.GITHUB_SHA_SHORT }}
          # REVISION: ${{ env.GITHUB_SHA }}
        run: |
          printf '{"revision":"%s","user":"GitHub"}' "$REVISION" | tee revision.json
          APPSIGNAL_URL=$(printf 'https://push.appsignal.com/1/markers?api_key=%s&name=%s&environment=%s' "$APPSIGNAL_PUSH_API_KEY" "$APPSIGNAL_APP_NAME" "$APPSIGNAL_APP_ENV")
          export APPSIGNAL_URL
          # CodeBuild has an insane conflict with YAML syntax and the URL, so put it in a file
          echo "url = \"$APPSIGNAL_URL\"" | tee curl.txt
          curl -g --config curl.txt -d @revision.json


  deploy-codedeploy:
    name: Deploy using CodeDeploy
    if: needs.config.outputs.deploy-codedeploy == '1'
    # needs: [test, test-prod, test-dialyzer, upload-assets, config]
    needs: [test, test-prod, create-release, config]
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.config.outputs.deploy-matrix) }}
    env:
      CODEDEPLOY_APPLICATION: foo-app
      CODEDEPLOY_BUCKET: foo-prod-bounce-public-deploy
      CODEDEPLOY_DEPLOYMENT_GROUP: foo-app
      DOCKER_FILE: deploy/${{ matrix.os }}.Dockerfile
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.create-release.outputs.release-tag }}
      VAR: ${{ matrix.elixir }}-erlang-${{ matrix.otp }}-${{ matrix.os }}-${{ matrix.build_os_ver }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set vars for runtime info
        shell: bash
        run: |
          echo "GIT_SHA_SHORT=$(echo "$GITHUB_SHA" | cut -c 1-7)" >> "$GITHUB_ENV"
          echo "GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "GIT_AUTHOR=$(git log -1 --pretty=format:'%ae')" >> "$GITHUB_ENV"

      - name: Download release files
        run: |
          gh release download "${RELEASE_TAG}" -p "codedeploy-revision-${{ github.run_number }}-${VAR}.zip"
          mkdir -p revision
          unzip -o "codedeploy-revision-${{ github.run_number }}-${VAR}.zip" -d revision

      - name: Set vars
        # run: echo "REVISION_FILE=${{env.CODEDEPLOY_APPLICATION}}-$(date +'%Y%m%d%H%M%S')-${{ github.run_number }}-${{env.VAR}}.zip" >> $GITHUB_ENV
        # run: echo "REVISION_FILE=${{env.CODEDEPLOY_APPLICATION}}-${{github.event.head_commit.timestamp}}-${{env.GITHUB_SHA_SHORT}}.zip" >> $GITHUB_ENV
        # echo "REVISION_FILE=${CODEDEPLOY_APPLICATION}-$(date +'%Y%m%d%H%M%S')-${RELEASE_TAG}-${VAR}.zip" >> $GITHUB_ENV
        run: |
          echo "RELEASE_TIMESTAMP=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_ENV"
          echo "REVISION_FILE=${CODEDEPLOY_APPLICATION}-${RELEASE_TAG}-${VAR}.zip" >> "$GITHUB_ENV"
          echo "GIT_AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae')" >> "$GITHUB_ENV"

      - name: Copy Erlang release file to S3
        env:
          ERLANG_RELEASE_FILE: "erlang-release-${{ github.run_number }}-${{ env.VAR }}.tar.gz"
        run: |
          gh release download "${RELEASE_TAG}" -p "${ERLANG_RELEASE_FILE}"
          aws s3 cp "${ERLANG_RELEASE_FILE}" "s3://${CODEDEPLOY_BUCKET}/erlang-release/${{ github.run_number }}/${VAR}/public.tar.gz"

      - name: Copy Ansible release file to S3
        env:
          # Convert matrix os/version name to name in Ansible inventory
          ANSIBLE_OS: ${{(matrix.os == 'alma' && 'AlmaLinux') || (matrix.os == 'centos7' && 'CentOS') || (matrix.os == 'rocky' && 'Rocky') || (matrix.os == 'ubuntu' && 'Ubuntu') }}
          ANSIBLE_OS_VER: ${{ (matrix.os == 'ubuntu' && matrix.prod_os_ver == 'jammy' && '22') || (matrix.os == 'ubuntu' && matrix.prod_os_ver == 'noble' && '24') || (matrix.os != 'ubuntu' && matrix.build_os_ver) || (matrix.os == 'centos7' && '7') }}
          ANSIBLE_RELEASE_FILE: "ansible-release-${{ github.run_number }}-${{ env.VAR }}.zip"
        run: |
          gh release download "${RELEASE_TAG}" -p "${ANSIBLE_RELEASE_FILE}"
          aws s3 cp "${ANSIBLE_RELEASE_FILE}" "s3://${CODEDEPLOY_BUCKET}/ansible-release/${{ github.run_number }}/ansible-release-${ANSIBLE_OS}-${ANSIBLE_OS_VER}.zip"

      - name: Create CodeDeploy revision
        run: |
          aws deploy push --application-name "${CODEDEPLOY_APPLICATION}" \
            --description "App ${RELEASE_TAG} ${RELEASE_TIMESTAMP} ${GITHUB_SHA_SHORT}" \
            --s3-location "s3://${CODEDEPLOY_BUCKET}/${REVISION_FILE}" \
            --source revision

      - name: Create CodeDeploy deployment
        run: |
          aws deploy create-deployment --application-name "${CODEDEPLOY_APPLICATION}" \
            --deployment-group-name "${CODEDEPLOY_DEPLOYMENT_GROUP}-${{ matrix.os }}" \
            --s3-location "bucket=${CODEDEPLOY_BUCKET},key=${REVISION_FILE},bundleType=zip" \
            --description "App ${RELEASE_TAG} ${RELEASE_TIMESTAMP} ${GITHUB_SHA_SHORT}"

      - name: Create Sentry release
        uses: getsentry/action-release@v3
        if: needs.config.outputs.notify-sentry == '1'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          # SENTRY_URL: https://sentry.io/
        with:
          environment: ${{ (github.ref_name == 'main' && 'staging') || (github.ref_name == 'prod' && 'production') }}
          dist: ${{ github.run_number }}
          # ignore_missing: true

      - name: Create AppSignal revision
        if: needs.config.outputs.notify-appsignal == '1'
        env:
          APPSIGNAL_APP_ENV: ${{ (github.ref_name == 'main' && 'stage') || (github.ref_name == 'qa' && 'qa') || (github.ref_name == 'prod' && 'prod') }}
          # APPSIGNAL_APP_ENV: ${{ (github.ref == 'refs/tags/prod' && 'prod') || (github.ref_name == 'main' && 'stage') || 'stage' }}
          APPSIGNAL_APP_NAME: ${{ env.ECS_SERVICE }}
          APPSIGNAL_PUSH_API_KEY: ${{ secrets.APPSIGNAL_PUSH_API_KEY }}
          REVISION: ${{ env.GITHUB_SHA_SHORT }}
          # REVISION: ${{ env.GITHUB_SHA }}
        run: |
          printf '{"revision":"%s","user":"GitHub"}' "$REVISION" | tee revision.json
          APPSIGNAL_URL=$(printf 'https://push.appsignal.com/1/markers?api_key=%s&name=%s&environment=%s' "$APPSIGNAL_PUSH_API_KEY" "$APPSIGNAL_APP_NAME" "$APPSIGNAL_APP_ENV")
          export APPSIGNAL_URL
          # CodeBuild has an insane conflict with YAML syntax and the URL, so put it in a file
          echo "url = \"$APPSIGNAL_URL\"" | tee curl.txt
          curl -g --config curl.txt -d @revision.json


  tag:
    name: Tag prod images as latest
    if: ${{ needs.config.outputs.tag-images == '1' && needs.config.outputs.deploy == '1' }}
    needs: [deploy-ecs, config]
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.config.outputs.deploy-matrix) }}
    env:
      DOCKER_FILE: deploy/${{ matrix.os }}.Dockerfile
      VAR: ${{ matrix.elixir }}-erlang-${{ matrix.otp }}-${{ matrix.os }}-${{ matrix.build_os_ver }}
      AWS_ENABLED: ${{ needs.config.outputs.aws-enabled }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: env.AWS_ENABLED == '1'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: env.AWS_ENABLED == '1'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set vars
        if: env.AWS_ENABLED == '1'
        run: echo "ECR_REGISTRY=${{ steps.ecr-login.outputs.registry }}" >> "$GITHUB_ENV"

      - name: Get branch name
        shell: bash
        run: echo "BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> "$GITHUB_ENV"

      - name: Set vars
        env:
          IMAGE_TAG_GHCR: ${{ needs.config.outputs.image-tag-ghcr }}
          IMAGE_TAG_ECR: ${{ needs.config.outputs.image-tag-ecr }}
        run: |
          echo "IMAGE_TAG_GHCR=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_ECR=${IMAGE_TAG_ECR}" >> "$GITHUB_ENV"

      # - name: Check out source
      #   uses: actions/checkout@v6

      - name: Tag GHCR release as latest
        run: |
          # skopeo copy --multi-arch=index-only \
          skopeo copy \
            "docker://ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:${VAR}${IMAGE_VER}" \
            "docker://ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:${IMAGE_TAG_GHCR}"

      - name: Tag ECR release as latest
        if: env.AWS_ENABLED == '1'
        run: |
          MANIFEST=$(aws ecr batch-get-image --repository-name "${ECR_IMAGE_OWNER}${IMAGE_NAME}" \
            --image-ids imageTag="${VAR}${IMAGE_VER}" \
            --output json | jq --raw-output --join-output '.images[0].imageManifest')
          export MANIFEST
          aws ecr put-image --repository-name "${ECR_IMAGE_OWNER}${IMAGE_NAME}" \
            --image-tag "$IMAGE_TAG_ECR" --image-manifest "$MANIFEST"
          # Requires higher permissions
          # aws ecr describe-images --repository-name "${ECR_IMAGE_OWNER}${IMAGE_NAME}"


  # Copy Elixir and OS base images to GHCR
  # Avoids Docker Hub rate limits and speeds up pull performance
  sync-images-matrix:
    name: Sync Elixir and OS base images
    needs: [config]
    if: needs.config.outputs.sync-images == '1'
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.config.outputs.sync-matrix) }}
    env:
      ELIXIR_BASE_TAG: ${{ matrix.elixir }}-erlang-${{ matrix.otp }}-${{ matrix.os }}-${{ matrix.build_os_ver }}
      MATRIX_OS: ${{ matrix.os }}
      MATRIX_BUILD_OS_VER: ${{ matrix.build_os_ver }}
      MATRIX_PROD_OS_VER: ${{ matrix.prod_os_ver }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check out source
        uses: actions/checkout@v6

      - name: Install regsync
        uses: regclient/actions/regsync-installer@v0.1.0
        with:
          # optional version
          release: 'v0.11.1'

      - name: Sync matrix images to GHCR
        run: regsync once -c deploy/regsync-ghcr-matrix.yml


  # Copy 3rd-party images to GHCR
  # Avoids Docker Hub rate limits and improves performance
  sync-images-ghcr:
    name: Sync 3rd-party images GHCR
    needs: [config]
    if: needs.config.outputs.sync-images == '1'
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check out source
        uses: actions/checkout@v6

      # https://github.com/regclient/actions
      - name: Install regsync
        uses: regclient/actions/regsync-installer@v0.1.0
        with:
          # optional version
          release: 'v0.11.1'

      - name: Sync images to GHCR
        run: regsync once -c deploy/regsync-ghcr.yml


  # Copy 3rd-party images to ECR
  # Avoids Docker Hub rate limits and speeds up pull performance
  # Required if you have 3rd-party images used at runtime
  sync-images-ecr:
    name: Sync 3rd-party images ECR
    needs: [config]
    if: needs.config.outputs.sync-images-ecr == '1'
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ (needs.config.outputs.environment == 'qa') && env.AWS_ACCOUNT_STAGING || secrets.AWS_ACCOUNT_ID }}

      - name: Set vars
        run: echo "ECR_REGISTRY=${{ steps.ecr-login.outputs.registry }}" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@v6

      - name: Install regsync
        uses: regclient/actions/regsync-installer@v0.1.0
        with:
          # optional version
          release: 'v0.11.1'

      - name: Sync images to ECR
        run: regsync once -c deploy/regsync-ecr.yml

  # To see debug logs, create a secret named ACTIONS_STEP_DEBUG with value 'true'
  # https://github.com/marketplace/actions/slack-notify-build
  # https://github.com/marketplace/actions/post-slack-message
